registry: ""

backend:
  replicaCount: 2
  image:
    repository: jobmarket-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/jobmarket"
    SPRING_DATASOURCE_USERNAME: "postgres"
    SPRING_REDIS_HOST: "redis"

frontend:
  replicaCount: 2
  image:
    repository: jobmarket-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ml:
  replicaCount: 1
  image:
    repository: jobmarket-ml
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: jobmarket.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: jobmarket-tls
      hosts:
        - jobmarket.example.com

postgres:
  enabled: false   # Use Azure Database for PostgreSQL in production

redis:
  enabled: true
  image: redis:7-alpine
  service:
    port: 6379
