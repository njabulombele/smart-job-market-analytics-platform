global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: jobmarket-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8080]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: jobmarket-backend

  - job_name: jobmarket-ml
    metrics_path: /metrics
    static_configs:
      - targets: [ml-service:8000]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
